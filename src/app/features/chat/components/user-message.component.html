<article class="flex w-full justify-end" aria-label="Your message">
  <div class="flex max-w-[min(85%,640px)] flex-col items-end">
    <div class="rounded-3xl rounded-br-lg bg-elevated px-4 py-3 sm:px-5">
      <p class="m-0 whitespace-pre-wrap break-words text-[15px] leading-[1.65] text-white">
        {{ content() }}
      </p>
      @if (timestamp()) {
        <time class="sr-only" [attr.datetime]="timestamp()">Sent at {{ timestamp() }}</time>
      }
    </div>
    <div class="mt-1">
      <app-copy-content-button [content]="content()" label="Copy your message" />
    </div>
  </div>
</article>
