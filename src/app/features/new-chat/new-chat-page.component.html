<div class="flex h-full min-h-0 flex-col">
  @if (submittedMessage(); as message) {
    <div class="min-h-0 flex-1 overflow-y-auto overscroll-contain px-4 py-6 sm:px-6">
      <div
        class="mx-auto flex w-full max-w-[840px] flex-col gap-8"
        aria-live="polite"
        [attr.aria-busy]="pending()"
      >
        <app-user-message [content]="message" />
        <app-assistant-response [loading]="pending()" [error]="error()" />
      </div>
    </div>

    <div
      class="sticky bottom-0 z-10 shrink-0 border-t border-line/50 bg-black/95 px-4 pb-4 pt-3 sm:px-6 sm:pb-6"
    >
      <div class="mx-auto w-full max-w-[800px]">
        <app-chat-composer
          [draft]="draft()"
          [pending]="pending()"
          placeholder="Continue your thought"
          (draftChange)="draft.set($event)"
          (submitted)="send($event)"
        />
      </div>
    </div>
  } @else {
    <div
      class="flex h-full flex-col items-center justify-center overflow-y-auto overscroll-contain px-4 py-4 sm:px-6"
    >
      <div class="flex flex-col items-center gap-5 sm:gap-8">
        <svg lucideMessageSquare class="text-disabled" size="24" />
        <h1
          class="m-0 text-center font-['Anton'] text-[clamp(2.25rem,10vw,4rem)] font-normal uppercase leading-[1] tracking-[-0.02em]"
        >
          Your will, my hands
        </h1>
      </div>

      <div class="mt-8 w-full max-w-[800px] sm:mt-12 md:mt-16">
        <app-chat-composer
          [draft]="draft()"
          [pending]="pending()"
          placeholder="What is your command? I will comply."
          (draftChange)="draft.set($event)"
          (submitted)="send($event)"
        />
      </div>

      <p
        class="mt-5 max-w-[480px] text-center font-sans text-[10px] font-medium uppercase leading-[1.5] tracking-[0.08em] text-disabled sm:mt-8 sm:text-[11px] sm:tracking-[0.1em]"
      >
        AI processing may generate inaccurate diagnostics. Verify critical outputs.
      </p>
    </div>
  }
</div>
